x-odoo-env: &odoo-env
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-odoo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
  ODOO_VERSION: ${ODOO_VERSION:-19.0}
  DEFAULT_MODULES: ${DEFAULT_MODULES:-}

x-odoo-common: &odoo-common
  build:
    context: .
    args:
      ODOO_VERSION: ${ODOO_VERSION:-19.0}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - odoo_data:/var/lib/odoo
    - .:/workspace

services:
  db:
    image: postgres:18
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_odoo:/var/lib/postgresql/data

  odoo:
    <<: *odoo-common
    ports:
      - "8069:8069"
      - "8071:8071"
      - "8072:8072"
    environment:
      <<: *odoo-env
      ODOO_DB: odoo-${ODOO_VERSION:-19.0}
    command: odoo-bin --database odoo-${ODOO_VERSION:-19.0}

  shell:
    <<: *odoo-common
    profiles: [dev]
    restart: "no"
    environment:
      <<: *odoo-env
      ODOO_DB: odoo-${ODOO_VERSION:-19.0}
      TERM: xterm
    tty: true
    stdin_open: true
    command: odoo-bin shell --database odoo-${ODOO_VERSION:-19.0}

  run-tests:
    <<: *odoo-common
    profiles: [test]
    restart: "no"
    environment:
      <<: *odoo-env
      ODOO_DB: test-db-${ODOO_VERSION:-19.0}
    command: >-
      bash -c "
        COVERAGE_FILE=/tmp/.coverage
        coverage run $$(which odoo-bin)
          --test-enable --stop-after-init
          --database test-db-$${ODOO_VERSION:-19.0}
        && COVERAGE_FILE=/tmp/.coverage coverage report"

volumes:
  postgres_odoo:
  odoo_data:
