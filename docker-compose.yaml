x-odoo-env: &odoo-env
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-odoo}}
  POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-odoo}}
  DB_USER: ${DB_USER:-${POSTGRES_USER:-odoo}}
  DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-odoo}}
  ODOO_VERSION: ${ODOO_VERSION:-19.0}
  DEFAULT_MODULES: ${DEFAULT_MODULES:-}

x-odoo-common: &odoo-common
  build:
    context: .
    args:
      ODOO_VERSION: ${ODOO_VERSION:-19.0}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - odoo_data:/var/lib/odoo
    - .:/workspace
    - /root/venla-extra-modules:/mnt/extra-addons

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-odoo}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-odoo}}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_odoo_v2:/var/lib/postgresql

  odoo:
    <<: *odoo-common
    ports:
      - "8069:8069"
      - "8071:8071"
      - "8072:8072"
    environment:
      <<: *odoo-env
      ODOO_DB: odoo-${ODOO_VERSION:-19.0}
    command: odoo --database odoo-${ODOO_VERSION:-19.0}

  shell:
    <<: *odoo-common
    profiles: [dev]
    restart: "no"
    environment:
      <<: *odoo-env
      ODOO_DB: odoo-${ODOO_VERSION:-19.0}
      TERM: xterm
    tty: true
    stdin_open: true
    command: odoo shell --database odoo-${ODOO_VERSION:-19.0}

  run-tests:
    <<: *odoo-common
    profiles: [test]
    restart: "no"
    environment:
      <<: *odoo-env
      ODOO_DB: test-db-${ODOO_VERSION:-19.0}
    command: >-
      bash -c "
        COVERAGE_FILE=/tmp/.coverage
        coverage run $$(which odoo)
          --test-enable --stop-after-init
          --database test-db-$${ODOO_VERSION:-19.0}
        && COVERAGE_FILE=/tmp/.coverage coverage report"

volumes:
  postgres_odoo_v2:
  odoo_data:
