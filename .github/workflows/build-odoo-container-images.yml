name: Build Odoo 14.0+ images

on:
  push:
    branches: [ "main" ]

jobs:
  test_run:
    name: Build Odoo ${{ matrix.odoo_version }} dev image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: test-${{ matrix.odoo_version }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        odoo_version: ["11.0","12.0","13.0","14.0", "15.0", "16.0", "17.0", "18.0"]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Setup Docker
      uses: docker/setup-buildx-action@v2

    - name: Building Odoo ${{ matrix.odoo_version }} 
      run: |
        docker compose build --build-arg ODOO_VERSION=${{ matrix.odoo_version }}
    
    - name: Testing Odoo ${{ matrix.odoo_version }} container service 
      run: |
        mkdir -p extra-addons
        docker compose up -d odoo
        timeout 180 bash -c 'until curl -sSf http://localhost:8069 >/dev/null; do 
          docker compose logs odoo
          echo "Waiting for Odoo...";
          sleep 10;
        done' || (echo "Timeout"; exit 1)
        curl -f http://localhost:8069 || exit 1

    - name: Check Odoo logs if failed
      if: failure()
      run: |
        export COMPOSE_PROJECT_NAME=odoo-test-${{ matrix.odoo_version }}
        docker compose logs odoo

    - name: Cleanup
      if: always()
      run: |
        export COMPOSE_PROJECT_NAME=odoo-test-${{ matrix.odoo_version }}
        docker compose down --volumes --remove-orphans